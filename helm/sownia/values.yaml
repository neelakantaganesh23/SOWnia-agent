global:
  environment: production

backend:
  replicaCount: 1
  image:
    repository: acrsowniaaksprod.azurecr.io/sownia-backend
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 7860
  # Google's redirect-URI validation requires HTTPS (or localhost) - point
  # this at the public, browser-reachable frontend origin, not the
  # ClusterIP-only backend. Overridden per environment via --set.
  googleRedirectUri: "https://sownia.yourdomain.com/api/v1/auth/google/callback"
  frontendBaseUrl: "https://sownia.yourdomain.com"
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

frontend:
  replicaCount: 1
  image:
    repository: acrsowniaaksprod.azurecr.io/sownia-frontend
    tag: latest
    pullPolicy: Always
  service:
    # LoadBalancer gives the frontend a public IP so it is reachable from a
    # browser (port-forward only works when kubectl runs on the same machine
    # as the browser, which is not the case when using Azure Cloud Shell).
    # The backend stays ClusterIP (private) — the frontend proxies /api to it.
    type: LoadBalancer
    port: 3000
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "15m"
  hosts:
    - host: sownia.yourdomain.com
      paths:
        - path: /
          pathType: Prefix
          backend: frontend
        - path: /api
          pathType: Prefix
          backend: backend
        - path: /health
          pathType: Exact
          backend: backend

secrets:
  googleApiKey: "YOUR_GOOGLE_API_KEY"
  hfToken: "YOUR_HF_TOKEN"
  langchainApiKey: "YOUR_LANGCHAIN_API_KEY"
  databaseUrl: "postgresql://user:pass@host:5432/sownia?sslmode=require"
  jwtSecretKey: "CHANGE_ME"
  googleClientId: ""
  googleClientSecret: ""
