apiVersion: v1
kind: Service
metadata:
  # Constant name (not release-prefixed) so the frontend's build-time-baked
  # proxy target "sownia-backend:7860" resolves in EVERY namespace (dev + prod).
  # Services are namespace-scoped, so this never collides across environments.
  name: sownia-backend
  labels:
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.port }}
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: backend
