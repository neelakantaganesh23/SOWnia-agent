apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app.kubernetes.io/name: sownia
type: Opaque
stringData:
  GOOGLE_API_KEY: {{ .Values.secrets.googleApiKey | quote }}
  HF_TOKEN: {{ .Values.secrets.hfToken | quote }}
  LANGCHAIN_API_KEY: {{ .Values.secrets.langchainApiKey | quote }}
  SECRET_KEY: {{ .Values.secrets.jwtSecretKey | quote }}
  GOOGLE_CLIENT_ID: {{ .Values.secrets.googleClientId | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.secrets.googleClientSecret | quote }}
  # In-cluster Postgres password, shared by the postgres StatefulSet and the
  # DATABASE_URL below.
  PG_PASSWORD: {{ .Values.postgres.password | quote }}
  # Built from the in-cluster postgres Service (<release>-postgres) - no
  # external DB host, no cloud PaaS quota needed.
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s-postgres:5432/%s" .Values.postgres.user .Values.postgres.password .Release.Name .Values.postgres.database | quote }}
