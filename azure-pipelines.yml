name: $(Build.DefinitionName)_$(Date:yyyyMMdd)$(Rev:.r)

# CI trigger: every push to main automatically queues this pipeline.
# batch:false means each push runs its own build (no batching/skipping).
trigger:
  batch: false
  branches:
    include:
      - main

# Do not run on pull requests (only on pushes to main).
pr: none

variables:
  azureSubscription: 'Azure-DevOps-Service-Connection'
  resourceGroup: 'rg-sownia-aks-prod'
  acrName: 'acrsowniaaksprod'
  aksCluster: 'aks-sownia-prod'
  imageRepositoryBackend: 'sownia-backend'
  imageRepositoryFrontend: 'sownia-frontend'
  dockerfilePathBackend: '$(Build.SourcesDirectory)/backend/Dockerfile'
  dockerfilePathFrontend: '$(Build.SourcesDirectory)/frontend/Dockerfile'
  tag: '$(Build.BuildId)'

stages:
  # ─── STAGE 1: Infrastructure Provisioning (Terraform) ─────────────────────
  - stage: Terraform
    displayName: '1. Provision AKS Infrastructure'
    jobs:
      - job: TerraformApply
        displayName: 'Terraform Plan & Apply'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: AzureCLI@1
            displayName: 'Terraform Init, Plan & Apply'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              # Expose the service-connection SP as env vars so Terraform (both
              # the provider AND the azurerm remote-state backend) can authenticate.
              addSpnToEnvironment: true
              inlineScript: |
                set -e

                # Map the SP credentials exposed by addSpnToEnvironment to the
                # ARM_* variables Terraform uses for provider + backend auth.
                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_CLIENT_SECRET="$servicePrincipalKey"
                export ARM_TENANT_ID="$tenantId"
                export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

                # Ensure terraform binary is installed
                if ! command -v terraform &> /dev/null; then
                  echo "Installing Terraform..."
                  wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
                  echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
                  sudo apt-get update && sudo apt-get install -y terraform
                fi

                # Providers must be pre-registered ONCE by the subscription owner
                # (see DEPLOYMENT.md). The service principal often lacks the
                # subscription-scope rights to register them, so this is best-effort
                # only and must never fail the build.
                az provider register --namespace Microsoft.ContainerService || echo "provider register skipped (insufficient rights - expected on free trial)"
                az provider register --namespace Microsoft.ContainerRegistry || true
                az provider register --namespace Microsoft.Network || true
                az provider register --namespace Microsoft.DBforPostgreSQL || true

                cd terraform
                # Postgres admin password comes from a pipeline secret variable,
                # never committed to the repo.
                export TF_VAR_pg_admin_password="$(PG_ADMIN_PASSWORD)"

                # init connects to the azurerm remote backend (Azure Storage)
                terraform init -input=false -upgrade
                terraform plan -input=false -out=tfplan
                terraform apply -input=false -auto-approve tfplan

                # Capture the Postgres host so the Deploy stage can build
                # DATABASE_URL without re-running Terraform. Written to a
                # pipeline variable visible to later stages.
                PG_FQDN=$(terraform output -raw postgres_fqdn)
                echo "##vso[task.setvariable variable=pgFqdn;isOutput=true]$PG_FQDN"
              name: TerraformOutputs

  # ─── STAGE 2: Build & Push Docker Images to ACR ────────────────────────────
  - stage: Build
    displayName: '2. Build & Push Docker Images'
    dependsOn: Terraform
    jobs:
      - job: BuildAndPush
        displayName: 'Docker Build & Push'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: AzureCLI@1
            displayName: 'Login to ACR, Build & Push Images'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                # Login to ACR
                az acr login --name $(acrName)
                
                # Build & Push Backend
                docker build -t $(acrName).azurecr.io/$(imageRepositoryBackend):$(tag) -t $(acrName).azurecr.io/$(imageRepositoryBackend):latest ./backend
                docker push $(acrName).azurecr.io/$(imageRepositoryBackend):$(tag)
                docker push $(acrName).azurecr.io/$(imageRepositoryBackend):latest
                
                # Build & Push Frontend
                docker build -t $(acrName).azurecr.io/$(imageRepositoryFrontend):$(tag) -t $(acrName).azurecr.io/$(imageRepositoryFrontend):latest ./frontend
                docker push $(acrName).azurecr.io/$(imageRepositoryFrontend):$(tag)
                docker push $(acrName).azurecr.io/$(imageRepositoryFrontend):latest

  # ─── STAGE 3: Deploy Helm Chart to AKS Cluster ─────────────────────────────
  - stage: Deploy
    displayName: '3. Deploy Helm Chart to AKS'
    dependsOn:
      - Terraform
      - Build
    variables:
      pgFqdn: $[ stageDependencies.Terraform.TerraformApply.outputs['TerraformOutputs.pgFqdn'] ]
    jobs:
      - job: HelmDeploy
        displayName: 'Deploy Unified Helm Release'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: AzureCLI@1
            displayName: 'Deploy via Helm to AKS'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e
                # Get AKS credentials
                az aks get-credentials --resource-group $(resourceGroup) --name $(aksCluster) --overwrite-existing

                # Username matches terraform/variables.tf's pg_admin_username default.
                DATABASE_URL="postgresql://sowniaadmin:$(PG_ADMIN_PASSWORD)@$(pgFqdn):5432/sownia?sslmode=require"

                # Upgrade or Install Helm Chart
                helm upgrade --install sownia ./helm/sownia \
                  --namespace default \
                  --set backend.image.repository=$(acrName).azurecr.io/$(imageRepositoryBackend) \
                  --set backend.image.tag=$(tag) \
                  --set frontend.image.repository=$(acrName).azurecr.io/$(imageRepositoryFrontend) \
                  --set frontend.image.tag=$(tag) \
                  --set secrets.googleApiKey="$(GOOGLE_API_KEY)" \
                  --set secrets.hfToken="$(HF_TOKEN)" \
                  --set secrets.databaseUrl="$DATABASE_URL" \
                  --set secrets.jwtSecretKey="$(JWT_SECRET_KEY)" \
                  --set secrets.googleClientId="$(GOOGLE_CLIENT_ID)" \
                  --set secrets.googleClientSecret="$(GOOGLE_CLIENT_SECRET)"
