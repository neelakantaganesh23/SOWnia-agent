name: $(Build.DefinitionName)_$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main

variables:
  azureSubscription: 'Azure-DevOps-Service-Connection'
  resourceGroup: 'rg-sownia-aks-prod'
  acrName: 'acrsowniaaksprod'
  aksCluster: 'aks-sownia-prod'
  imageRepositoryBackend: 'sownia-backend'
  imageRepositoryFrontend: 'sownia-frontend'
  dockerfilePathBackend: '$(Build.SourcesDirectory)/backend/Dockerfile'
  dockerfilePathFrontend: '$(Build.SourcesDirectory)/frontend/Dockerfile'
  tag: '$(Build.BuildId)'

stages:
  # ─── STAGE 1: Infrastructure Provisioning (Terraform) ─────────────────────
  - stage: Terraform
    displayName: '1. Provision AKS Infrastructure'
    jobs:
      - job: TerraformApply
        displayName: 'Terraform Plan & Apply'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: AzureCLI@2
            displayName: 'Terraform Init, Plan & Apply'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                cd terraform
                terraform init
                terraform plan -out=tfplan
                terraform apply -auto-approve tfplan

  # ─── STAGE 2: Build & Push Docker Images to ACR ────────────────────────────
  - stage: Build
    displayName: '2. Build & Push Docker Images'
    dependsOn: Terraform
    jobs:
      - job: BuildAndPush
        displayName: 'Docker Build & Push'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: AzureCLI@2
            displayName: 'Login to ACR, Build & Push Images'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                # Login to ACR
                az acr login --name $(acrName)
                
                # Build & Push Backend
                docker build -t $(acrName).azurecr.io/$(imageRepositoryBackend):$(tag) -t $(acrName).azurecr.io/$(imageRepositoryBackend):latest ./backend
                docker push $(acrName).azurecr.io/$(imageRepositoryBackend):$(tag)
                docker push $(acrName).azurecr.io/$(imageRepositoryBackend):latest
                
                # Build & Push Frontend
                docker build -t $(acrName).azurecr.io/$(imageRepositoryFrontend):$(tag) -t $(acrName).azurecr.io/$(imageRepositoryFrontend):latest ./frontend
                docker push $(acrName).azurecr.io/$(imageRepositoryFrontend):$(tag)
                docker push $(acrName).azurecr.io/$(imageRepositoryFrontend):latest

  # ─── STAGE 3: Deploy Helm Chart to AKS Cluster ─────────────────────────────
  - stage: Deploy
    displayName: '3. Deploy Helm Chart to AKS'
    dependsOn: Build
    jobs:
      - job: HelmDeploy
        displayName: 'Deploy Unified Helm Release'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: AzureCLI@2
            displayName: 'Deploy via Helm to AKS'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                # Get AKS credentials
                az aks get-credentials --resource-group $(resourceGroup) --name $(aksCluster) --overwrite-existing
                
                # Upgrade or Install Helm Chart
                helm upgrade --install sownia ./helm/sownia \
                  --namespace default \
                  --set backend.image.repository=$(acrName).azurecr.io/$(imageRepositoryBackend) \
                  --set backend.image.tag=$(tag) \
                  --set frontend.image.repository=$(acrName).azurecr.io/$(imageRepositoryFrontend) \
                  --set frontend.image.tag=$(tag) \
                  --set secrets.googleApiKey="$(GOOGLE_API_KEY)" \
                  --set secrets.hfToken="$(HF_TOKEN)"
